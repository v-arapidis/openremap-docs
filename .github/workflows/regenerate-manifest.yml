name: Regenerate manifest

# Keeps `content/manifest.json` in sync so the no-redeploy (remote) content
# source always sees new/renamed pages — no manual `npm run manifest` needed
# on every content push.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/build-manifest.mjs

      - name: Commit manifest.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json
          if git diff --cached --quiet; then
            echo "content/manifest.json is up to date"
          else
            git commit -m "chore: regenerate content/manifest.json"
            git push
          fi
